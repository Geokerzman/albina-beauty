server {
    listen 80;
    listen [::]:80;
    server_name albina-new.rootforce.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/albina-new/acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://albina-new.rootforce.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name albina-new.rootforce.dev;
    ssl_certificate /etc/letsencrypt/live/albina-new.rootforce.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/albina-new.rootforce.dev/privkey.pem;

    access_log /var/log/nginx/albina-new.access.log;
    error_log /var/log/nginx/albina-new.error.log;
    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/albina-new/acme;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:43179;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }
}
